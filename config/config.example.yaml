# Copy to config/config.yaml (gitignored).

# -- SAFETY (a hook blocks Claude from editing these) -------------------------
live_trading_approved: false
max_order_notional: 500
max_daily_notional: 2000
allowed_order_types: [limit]
sequenced_execution: true      # sells settle before buys; costs reserved (docs/01)
reserve_cost_rate: 0.0025      # cash held back to cover spread+slippage on buys

portfolio:
  sleeve_c_pct_of_total: 0.08
  sleeve_e_pct_of_total: 0.02
  target_positions: 20
  min_positions: 15
  max_positions: 25
  buffer_rank: 80              # set by the turnover constraint (SPEC §7.2), NOT by returns
  no_trade_band: 0.03          # skip rebalancing trades below 3% of NAV drift (SPEC §7.1)
  target_turnover_annual: 0.45 # design target
  max_turnover_annual: 0.60    # hard ceiling = kill criterion #4
  max_position_weight: 0.06
  trim_trigger_weight: 0.12
  max_sector_weight: 0.25
  min_holding_days: 365
  rebalance_months: [2, 5, 8, 11]
  rebalance_week: 3

universe:
  min_market_cap: 2_000_000_000
  min_adv_60d: 10_000_000
  min_price: 5.00
  min_quarters_filed: 8
  min_months_since_ipo: 24

scoring:
  durability_max: 50
  valuation_max: 35
  momentum_max: 15
  overlay_gate_rank: 40
  insider_overlay_range: [-2, 3]
  political_overlay_range: [-1, 2]
  institutional_overlay_range: [-1, 2]
  overlay_total_clip: 5

valuation:
  terminal_growth: 0.025
  equity_risk_premium: 0.05
  wacc_floor: 0.08
  max_implied_growth: 0.25
  max_ev_ebit: 45

# -- FACTOR IC (docs/09 §7, docs/13 §2.3) ------------------------------------
factor_ic:
  enabled: true
  horizons_quarters: [1, 2, 4, 8]
  n_quantiles: 5
  method: spearman              # rank correlation; NOT pearson
  suspicious_ic_threshold: 0.15 # above this on real data, suspect look-ahead
  min_periods_for_tstat: 8

# -- SIGNALS (docs/10) --------------------------------------------------------
signals:
  llm_extraction:
    enabled: true
    model: "claude-opus-5"
    model_training_cutoff: "2025-01-01"   # backtests before this are CONTAMINATED
    prompt_version: "v1"
    temperature: 0
    audit_sample_rate: 0.10
    contamination_test_required: true
  institutional:
    enabled: true
    managers_file: config/managers.yaml
    min_managers_for_signal: 3
  distress:
    enabled: true
    dd_warn: 2.0
    dd_exclude: 1.0
    dd_exclude_sleeve_e: 1.5
  short_interest:
    enabled: true
    pct_float_warn: 0.15
    pct_float_exclude: 0.25
    pct_float_exclude_sleeve_e: 0.10
  credit:
    enabled: true
    spread_widening_alert_bps: 150

# -- SLEEVE E (docs/08) -------------------------------------------------------
# Universe and sizing SAFETY limits are hard-coded module constants in
# src/durable/discovery/ and are NOT tunable here, by design. A PreToolUse hook
# blocks edits that would weaken them.
discovery:
  enabled: true
  max_positions: 8
  watchlist_threshold: 65
  position_threshold: 75
  durability_gate: 30
  tranche_fractions: [0.40, 0.30, 0.30]
  min_days_between_tranches: 90
  cancel_score_threshold: 60
  graduation_market_cap: 3_000_000_000
  graduation_analyst_count: 6
  require_bear_case: true
  dossier_dir: reports/discovery

# -- TAX (docs/11) ------------------------------------------------------------
tax:
  enabled: true
  accounts: [taxable, roth, traditional_ira]
  lot_method: after_tax_optimal
  harvest_min_loss_pct: 0.08
  harvest_min_loss_dollars: 150
  harvest_accounts: [taxable]
  wash_sale_window_days: 61
  model_drip_as_purchase: true
  marginal_rate_ordinary: 0.22
  rate_long_term: 0.15
  ordinary_income_offset_cap: 3000

# -- BACKTEST + VALIDATION (docs/03, 09) --------------------------------------
backtest:
  design_period:     ["1998-01-01", "2010-12-31"]
  validation_period: ["2011-01-01", "2018-12-31"]
  holdout_period:    ["2019-01-01", null]
  cost_multiplier: 1.0
  slippage_bps_liquid: 10
  slippage_bps_midcap: 25
  min_half_spread_bps: 2
  delisting_friction_bps: 100
  seed: 42
  # Accounting invariants (PROTOCOL §4.1) — a violation invalidates the run
  assert_no_negative_cash: true
  assert_nav_reconciles: true

# Almgren-Chriss impact (docs/13 §2.4). Publish these in methodology.md —
# an impact model is an assumption, not a measurement.
impact:
  enabled: true
  eta: 2.5e-6       # temporary impact coefficient
  gamma: 2.5e-7     # permanent impact coefficient
  alpha: 0.5        # participation exponent; 0.5 = square-root law

cpcv:
  n_groups: 10
  k_test_groups: 3            # C(10,3) = 120 paths
  embargo_pct: 0.01
  purge_horizon_quarters: 4
  pbo_kill_threshold: 0.50

# -- DATA ---------------------------------------------------------------------
data:
  duckdb_path: data/durable.duckdb
  sec_identity: "your.name@example.com"
  available_at_lag_trading_days: 1
  edgar_max_requests_per_second: 10
  price_source: alpaca
  require_raw_ohlcv: true       # firewall rejects adjusted-only series
  fundamentals_source: edgar
  political_source: stockwatcher
  institutional_source: edgar
  short_interest_source: finra
  firewall_enabled: true        # never set false; the audit relies on it

# -- REPORTING (docs/07) ------------------------------------------------------
reporting:
  benchmark_primary: VTI
  benchmark_secondary: [SPY, EQUAL_WEIGHT_UNIVERSE]
  inception_date: null
  bootstrap_n: 10000
  bootstrap_method: stationary_block
  bootstrap_block_size: null
  confidence_level: 0.95
  min_periods_for_ci: 8
  min_quarters_before_inference: 12
  turnover_kill_threshold: 0.60
  alpha_tstat_threshold: 2.0
  research_export_dir: reports/research
  figure_dpi: 300

# -- RESEARCH (docs/12) -------------------------------------------------------
research:
  enabled: true
  preregistration_required: true
  zotero_library_id: null
  journal_file: research/journal/decisions.csv
  claims_file: research/literature/claims.csv
  min_predictions_for_calibration: 20
