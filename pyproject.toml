[project]
name = "durable-alpha"
version = "0.1.0"
description = "Rules-based long-horizon equity system and research study"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
    "edgartools>=5.0",
    "pandas-datareader>=0.10",
    "fredapi>=0.5",
    "requests>=2.32",
    "exchange-calendars>=4.5",
    "alpaca-py>=0.40",
    "quantstats>=0.0.78",
    "arch>=7.2",
    "jinja2>=3.1",
    "matplotlib>=3.9",
    "pyzotero>=1.5",
    "bibtexparser>=1.4",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
gui = [
    "streamlit>=1.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/durable"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
